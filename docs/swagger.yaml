basePath: /
definitions:
  models.AnalyzeRequest:
    properties:
      incrementalRequest:
        $ref: '#/definitions/models.IncrementalAnalysisRequest'
      requestType:
        type: string
      structurizeRequest:
        $ref: '#/definitions/models.StructurizeRequest'
      summarizeRequest:
        $ref: '#/definitions/models.SummarizeRequest'
      templateRequest:
        $ref: '#/definitions/models.GenerateTemplateRequest'
    type: object
  models.Board:
    properties:
      boardId:
        type: string
      elements:
        items:
          $ref: '#/definitions/models.Element'
        type: array
      graphEdges:
        items:
          $ref: '#/definitions/models.GEdge'
        type: array
      graphNodes:
        items:
          $ref: '#/definitions/models.GNode'
        type: array
      imageUrl:
        type: string
    type: object
  models.BoardType:
    enum:
    - simple
    - graph
    type: string
    x-enum-varnames:
    - BoardTypeSimple
    - BoardTypeGraph
  models.ChangeType:
    enum:
    - added
    - modified
    - deleted
    type: string
    x-enum-varnames:
    - ChangeAdded
    - ChangeModified
    - ChangeDeleted
  models.Element:
    properties:
      content:
        description: inserted from text model
        type: string
      cornerRadius:
        description: inserted from rectangle model
        type: integer
      fill:
        type: string
      height:
        type: number
      id:
        type: string
      points:
        items:
          type: number
        type: array
      rotation:
        type: number
      stroke:
        type: string
      strokeWidth:
        type: integer
      tension:
        type: number
      type:
        type: string
      width:
        type: number
      x:
        type: number
      "y":
        type: number
    type: object
  models.ElementChange:
    properties:
      changeType:
        $ref: '#/definitions/models.ChangeType'
      elementId:
        type: string
      newElement:
        $ref: '#/definitions/models.Element'
      oldElement:
        $ref: '#/definitions/models.Element'
    type: object
  models.File:
    properties:
      children:
        items:
          $ref: '#/definitions/models.File'
        type: array
      name:
        type: string
      type:
        type: string
    type: object
  models.GEdge:
    properties:
      id:
        type: string
      label:
        type: string
      source:
        type: string
      target:
        type: string
    type: object
  models.GNode:
    properties:
      data:
        $ref: '#/definitions/models.GNodeData'
      id:
        type: string
      type:
        type: string
    type: object
  models.GNodeData:
    properties:
      description:
        type: string
      element:
        $ref: '#/definitions/models.GraphElement'
      title:
        type: string
      url:
        type: string
    type: object
  models.GenerateTemplateRequest:
    properties:
      boardId:
        type: string
      boardType:
        $ref: '#/definitions/models.BoardType'
      prompt:
        type: string
      requestId:
        type: string
      requestType:
        type: string
      userId:
        type: string
    type: object
  models.GenerateTemplateResponse:
    properties:
      board:
        $ref: '#/definitions/models.Board'
      requestId:
        type: string
      requestType:
        type: string
      userId:
        type: string
    type: object
  models.GraphElement:
    properties:
      path:
        items:
          type: string
        type: array
      title:
        type: string
      type:
        type: string
    type: object
  models.IncrementalAnalysisRequest:
    properties:
      boardId:
        type: string
      changes:
        items:
          $ref: '#/definitions/models.ElementChange'
        type: array
      fullBoard:
        $ref: '#/definitions/models.Board'
      isFullRescan:
        type: boolean
      requestId:
        type: string
      requestType:
        type: string
      userId:
        type: string
    type: object
  models.IncrementalAnalysisResponse:
    properties:
      globalSummary:
        type: string
      isFullRescan:
        type: boolean
      keyConcepts:
        items:
          type: string
        type: array
      requestId:
        type: string
      requestType:
        type: string
      updatedRegions:
        items:
          type: string
        type: array
      userId:
        type: string
    type: object
  models.Job:
    properties:
      createdAt:
        type: integer
      id:
        type: string
      request:
        $ref: '#/definitions/models.AnalyzeRequest'
      retries:
        type: integer
      status:
        $ref: '#/definitions/models.JobStatus'
    type: object
  models.JobStatus:
    enum:
    - pending
    - running
    - completed
    - failed
    - aborted
    type: string
    x-enum-varnames:
    - JobStatusPending
    - JobStatusRunning
    - JobStatusCompleted
    - JobStatusFailed
    - JobStatusAborted
  models.StructurizeRequest:
    properties:
      board:
        $ref: '#/definitions/models.Board'
      file:
        $ref: '#/definitions/models.File'
      requestId:
        type: string
      requestType:
        type: string
      userId:
        type: string
    type: object
  models.StructurizeResponse:
    properties:
      aiTreeResponse:
        type: string
      file:
        $ref: '#/definitions/models.File'
      requestId:
        type: string
      requestType:
        type: string
      userId:
        type: string
    type: object
  models.SummarizeRequest:
    properties:
      board:
        $ref: '#/definitions/models.Board'
      requestId:
        type: string
      requestType:
        type: string
      userId:
        type: string
    type: object
  models.SummarizeResponse:
    properties:
      requestId:
        type: string
      requestType:
        type: string
      text:
        $ref: '#/definitions/models.Text'
      userId:
        type: string
    type: object
  models.Text:
    properties:
      content:
        type: string
      fill:
        type: string
      height:
        type: number
      id:
        type: string
      rotation:
        type: number
      stroke:
        type: string
      strokeWidth:
        type: integer
      type:
        type: string
      width:
        type: number
      x:
        type: number
      "y":
        type: number
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: AI Service for processing board data with summarization and structurization
    capabilities
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: AIService API
  version: "1.0"
paths:
  /health:
    get:
      consumes:
      - application/json
      description: Check if the service is running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - Health
  /jobs/{id}:
    get:
      consumes:
      - application/json
      description: Get the status of a job by ID
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Job'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get job status
      tags:
      - Jobs
  /jobs/{id}/abort:
    put:
      consumes:
      - application/json
      description: Abort a job by ID
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Abort a job
      tags:
      - Jobs
  /structurize:
    post:
      consumes:
      - application/json
      description: Process a board and return a structured file hierarchy
      parameters:
      - description: Structurize Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.StructurizeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.StructurizeResponse'
        "202":
          description: Job ID
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Structurize a board
      tags:
      - Processing
  /summarize:
    post:
      consumes:
      - application/json
      description: Process a board and return a summary of the content
      parameters:
      - description: Summarize Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.SummarizeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SummarizeResponse'
        "202":
          description: Job ID
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Summarize a board
      tags:
      - Processing
  /summarize/incremental:
    post:
      consumes:
      - application/json
      description: Analyze board changes incrementally
      parameters:
      - description: Incremental Analysis Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.IncrementalAnalysisRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.IncrementalAnalysisResponse'
        "202":
          description: Job ID
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Incremental board analysis
      tags:
      - Analysis
  /template:
    post:
      consumes:
      - application/json
      description: Generate a board template from a text prompt
      parameters:
      - description: Generate Template Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.GenerateTemplateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.GenerateTemplateResponse'
        "202":
          description: Job ID
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Generate board template
      tags:
      - Template
schemes:
- http
- https
swagger: "2.0"
